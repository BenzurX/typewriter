<!doctype html>
<meta charset="utf-8">
<title>Endless paper regression</title>
<body data-result="RUNNING">RUNNING
<iframe id="app" src="../index.html" hidden></iframe>
<script>
const frame = document.querySelector('#app');
let phase = 'write';
frame.addEventListener('load', () => {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  if (phase === 'reload') {
    const restored = Array.from(doc.querySelectorAll('.impression'), node => node.textContent).join('');
    const rows = parseInt(doc.documentElement.style.getPropertyValue('--rows'), 10);
    const saved = JSON.parse(win.localStorage.getItem('typewriter:v1'));
    const wrappedRight = saved.cells['55,0'] && saved.cells['55,0'].i[0][0] === 'C';
    const pagedTop = saved.cells['0,1'] && saved.cells['0,1'].i[0][0] === 'D';
    const pagedBottom = saved.cells['73,2'] && saved.cells['73,2'].i[0][0] === 'E';
    const profilePersisted = doc.querySelector('#opt-sound-profile').value === 'teleprinter' && doc.querySelector('#opt-sound-profile-face').textContent === 'Electric Teleprinter';
    const clearCard = doc.querySelector('#erase-confirm');
    const clearStyled = clearCard.classList.contains('card') && clearCard.querySelector('.card-rule') && clearCard.querySelector('#erase-confirm-title').textContent === 'Clear this page?' && clearCard.querySelector('#erase-confirm-text').textContent === 'This cannot be undone.' && clearCard.querySelector('#erase-close') && win.getComputedStyle(clearCard).borderRadius === '7px';
    const contentPass = restored.includes('A') && restored.includes('B') && restored.includes('C') && restored.includes('D') && restored.includes('E') && wrappedRight && pagedTop && pagedBottom && profilePersisted && clearStyled && rows === 74;
    doc.querySelector('.rail-key[data-action="erase"]').click();
    const opened = !clearCard.hidden;
    doc.body.dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true }));
    win.setTimeout(() => {
      const clickoutClosed = clearCard.hidden;
      doc.querySelector('.rail-key[data-action="erase"]').click();
      doc.querySelector('#erase-close').click();
      win.setTimeout(() => {
        const xClosed = clearCard.hidden;
        const pass = contentPass && opened && clickoutClosed && xClosed;
        document.body.dataset.result = pass ? 'PASS' : 'FAIL';
        document.body.textContent = (pass ? 'PASS' : 'FAIL') + ': restored=' + JSON.stringify(restored) + ', rows=' + rows + ', clickout=' + clickoutClosed + ', x=' + xClosed;
      }, 280);
    }, 280);
    return;
  }
  const key = value => doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: value, bubbles: true }));
  key('A');
  for (let i = 0; i < 54; i++) key('Enter');
  key('B');
  key('End');
  key('ArrowRight');
  key('C');
  key('PageUp');
  key('D');
  key('PageDown');
  key('E');
  const profile = doc.querySelector('#opt-sound-profile');
  profile.value = 'teleprinter';
  profile.dispatchEvent(new win.Event('change', { bubbles: true }));
  const text = Array.from(doc.querySelectorAll('.impression'), node => node.textContent).join('');
  if (!text.includes('A') || !text.includes('B')) {
    document.body.dataset.result = 'FAIL';
    document.body.textContent = 'FAIL: impressions=' + JSON.stringify(text);
    return;
  }
  phase = 'reload';
  frame.src = '../index.html?reload=1';
});
</script>
